<form
  [formRoot]="searchForm"
  class="mt-8 flex max-w-[880px] flex-col rounded-2xl bg-white p-2 shadow-[0_20px_60px_rgba(0,0,0,0.18)] md:flex-row md:items-center"
  novalidate
>
  <div class="grid flex-1 grid-cols-[32px_1fr] px-3.5 py-2">
    <span class="row-span-2 self-center text-brand-700">
      <ui-icon name="map-pin" size="md" />
    </span>
    <label for="search-q" class="col-start-2 text-xs font-extrabold text-ink">¿Dónde?</label>
    <input
      id="search-q"
      type="search"
      placeholder="Ciudad, barrio o propiedad"
      [formField]="searchForm.q"
      class="col-start-2 w-full border-0 bg-transparent p-0 text-sm text-ink outline-none placeholder:text-muted"
    />
  </div>

  <div class="hidden h-10 w-px bg-line md:block" aria-hidden="true"></div>

  <div class="grid flex-1 grid-cols-[32px_1fr] px-3.5 py-2">
    <span class="row-span-2 self-center text-brand-700">
      <ui-icon name="wallet" size="md" />
    </span>
    <label for="search-budget" class="col-start-2 text-xs font-extrabold text-ink"
      >Presupuesto mensual</label
    >
    <div class="col-start-2 w-full">
      <input
        id="search-budget"
        type="range"
        [min]="budgetMin"
        [max]="budgetMax"
        [step]="budgetStep"
        [value]="budget()"
        (input)="onBudgetInput($event)"
        [attr.aria-valuetext]="budgetValueText()"
        aria-describedby="search-budget-value"
        class="w-full accent-brand-700"
      />
      <p id="search-budget-value" class="text-xs font-bold text-ink">
        @if (budgetIsFilter()) {
          Máximo: {{ budget() | currency: 'COP' : 'symbol-narrow' : '1.0-0' }} / mes
        } @else {
          Sin límite de presupuesto
        }
      </p>
    </div>
  </div>

  <button
    type="submit"
    class="mt-2 flex min-h-14 items-center justify-center gap-2 rounded-[14px] bg-brand-700 px-6 font-black text-white transition hover:bg-brand-600 md:mt-0"
  >
    <ui-icon name="search" size="md" /> Buscar
  </button>
</form>
