<form [formRoot]="pricingForm" class="space-y-4" novalidate>
  <div class="grid gap-4 sm:grid-cols-2">
    <ui-form-field
      htmlFor="host-pricing-amount"
      label="Precio base por noche"
      hint="Sin decimales obligatorios; se admite hasta dos decimales."
      [error]="priceError()"
    >
      <input
        id="host-pricing-amount"
        type="text"
        inputmode="decimal"
        [formField]="pricingForm.price"
        [attr.aria-describedby]="priceError() ? 'host-pricing-amount-error' : null"
        [attr.aria-invalid]="priceError() ? 'true' : null"
        class="w-full rounded-xl border border-line bg-white px-3 py-2.5 text-sm text-ink outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20"
      />
    </ui-form-field>

    <ui-form-field htmlFor="host-pricing-currency" label="Moneda">
      <select
        id="host-pricing-currency"
        [formField]="pricingForm.currency"
        class="w-full rounded-xl border border-line bg-white px-3 py-2.5 text-sm text-ink outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20"
      >
        <option value="COP">COP</option>
        <option value="USD">USD</option>
      </select>
    </ui-form-field>
  </div>

  <ui-alert [message]="error()" />
  @if (savedPrice(); as pricing) {
    <ui-alert
      variant="success"
      [message]="
        'Precio guardado: ' +
        (pricing.basePricePerNight | currency: pricing.currency : 'symbol-narrow' : '1.0-2') +
        ' por noche'
      "
    />
  }

  <ui-button [loading]="submitting()">
    {{ submitting() ? 'Guardando…' : 'Guardar precio' }}
  </ui-button>
</form>
