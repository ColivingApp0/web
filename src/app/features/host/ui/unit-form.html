<form [formRoot]="unitForm" class="space-y-5" novalidate>
  <ui-form-field
    htmlFor="host-unit-name"
    label="Nombre de la habitación"
    [error]="nameError()"
    [required]="true"
  >
    <input
      id="host-unit-name"
      type="text"
      placeholder="Ej. Habitación compartida con baño privado"
      [formField]="unitForm.name"
      [attr.aria-describedby]="nameError() ? 'host-unit-name-error' : null"
      [attr.aria-invalid]="nameError() ? 'true' : null"
      class="ui-input"
    />
  </ui-form-field>

  <ui-form-field
    htmlFor="host-unit-description"
    label="Descripción de la habitación"
    hint="Describe el espacio, el mobiliario y la convivencia. No repitas los servicios del inmueble."
  >
    <textarea
      id="host-unit-description"
      rows="3"
      [formField]="unitForm.description"
      class="ui-textarea"
    ></textarea>
  </ui-form-field>

  <div class="grid gap-4 sm:grid-cols-2">
    <ui-form-field htmlFor="host-unit-room-type" label="Tipo de habitación">
      <select id="host-unit-room-type" [formField]="unitForm.roomType" class="ui-select">
        <option value="INDIVIDUAL">Individual (1 plaza)</option>
        <option value="COMPARTIDA">Compartida (varias plazas)</option>
      </select>
    </ui-form-field>

    <ui-form-field
      htmlFor="host-unit-guests"
      label="Capacidad máxima"
      hint="Número total de plazas de la habitación."
      [error]="capacityError()"
      [required]="true"
    >
      <input
        id="host-unit-guests"
        type="text"
        inputmode="numeric"
        [formField]="unitForm.maxGuests"
        [attr.aria-describedby]="capacityError() ? 'host-unit-guests-error' : null"
        [attr.aria-invalid]="capacityError() ? 'true' : null"
        class="ui-input"
      />
    </ui-form-field>
  </div>

  <fieldset class="rounded-xl border border-line p-4">
    <legend class="px-1 text-sm font-bold text-ink">Precio mensual</legend>
    <div class="mt-3 grid gap-4 sm:grid-cols-3">
      <ui-form-field
        htmlFor="host-unit-price"
        label="Importe mensual"
        hint="Puedes dejarlo vacío y completarlo después."
        [error]="priceError()"
      >
        <input
          id="host-unit-price"
          type="text"
          inputmode="decimal"
          placeholder="780000"
          [formField]="unitForm.monthlyPrice"
          [attr.aria-describedby]="priceError() ? 'host-unit-price-error' : null"
          [attr.aria-invalid]="priceError() ? 'true' : null"
          class="ui-input"
        />
      </ui-form-field>
      <ui-form-field htmlFor="host-unit-currency" label="Moneda">
        <select id="host-unit-currency" [formField]="unitForm.currency" class="ui-select">
          <option value="COP">COP</option>
          <option value="USD">USD</option>
        </select>
      </ui-form-field>
      <ui-form-field htmlFor="host-unit-price-unit" label="Se cobra">
        <select id="host-unit-price-unit" [formField]="unitForm.priceUnit" class="ui-select">
          <option value="POR_HABITACION">Por habitación</option>
          <option value="POR_PERSONA">Por persona / plaza</option>
        </select>
      </ui-form-field>
    </div>
    @if (model().roomType === 'INDIVIDUAL') {
      <p class="mt-2 text-xs text-muted">
        Las habitaciones individuales se cobran siempre por habitación.
      </p>
    }
  </fieldset>

  <div class="grid gap-4 sm:grid-cols-2">
    <ui-form-field htmlFor="host-unit-bathroom" label="Baño">
      <select id="host-unit-bathroom" [formField]="unitForm.bathroomType" class="ui-select">
        <option value="PRIVADO">Privado (dentro de la habitación)</option>
        <option value="COMPARTIDO">Compartido con la propiedad</option>
      </select>
    </ui-form-field>
    <ui-form-field
      htmlFor="host-unit-common-areas"
      label="Acceso a zonas comunes"
      hint="Sepáralas con comas. Ej.: Cocina, Terraza, Zona de estudio."
    >
      <input
        id="host-unit-common-areas"
        type="text"
        [formField]="unitForm.commonAreas"
        class="ui-input"
      />
    </ui-form-field>
  </div>

  <fieldset class="space-y-2">
    <legend class="text-sm font-semibold text-ink">Climatización</legend>
    <label
      class="flex min-h-10 cursor-pointer items-center gap-2.5 rounded-xl border border-line px-3 text-sm text-ink"
    >
      <input
        type="checkbox"
        [formField]="unitForm.airConditioning"
        class="size-4 accent-brand-700"
      />
      <ui-icon name="snowflake" size="sm" class="text-brand-700" /> Aire acondicionado
    </label>
    <label
      class="flex min-h-10 cursor-pointer items-center gap-2.5 rounded-xl border border-line px-3 text-sm text-ink"
    >
      <input type="checkbox" [formField]="unitForm.fan" class="size-4 accent-brand-700" />
      <ui-icon name="fan" size="sm" class="text-brand-700" /> Ventilador
    </label>
  </fieldset>

  <ui-alert [message]="serverError()" />

  <ui-button [loading]="submitting()">
    {{ isEdit() ? 'Guardar habitación' : 'Crear habitación' }}
  </ui-button>
</form>
