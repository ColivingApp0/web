<form [formRoot]="rulesForm" class="space-y-4" novalidate>
  <div class="grid gap-4 sm:grid-cols-2">
    <ui-form-field
      htmlFor="host-rules-policy"
      label="Política de cancelación"
      [error]="policyError()"
    >
      <select
        id="host-rules-policy"
        [formField]="rulesForm.policy"
        [attr.aria-describedby]="policyError() ? 'host-rules-policy-error' : null"
        class="w-full rounded-xl border border-line bg-white px-3 py-2.5 text-sm text-ink outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20"
      >
        <option value="">Selecciona una política</option>
        <option value="FLEXIBLE">Flexible</option>
        <option value="MODERADA">Moderada</option>
        <option value="ESTRICTA">Estricta</option>
      </select>
    </ui-form-field>

    <ui-form-field htmlFor="host-rules-house" label="Reglas de la casa" hint="Separadas por comas.">
      <input
        id="host-rules-house"
        type="text"
        [formField]="rulesForm.houseRules"
        class="w-full rounded-xl border border-line bg-white px-3 py-2.5 text-sm text-ink outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20"
      />
    </ui-form-field>

    <ui-form-field htmlFor="host-rules-checkin" label="Hora de check-in" [error]="checkInError()">
      <input
        id="host-rules-checkin"
        type="time"
        [formField]="rulesForm.checkIn"
        [attr.aria-describedby]="checkInError() ? 'host-rules-checkin-error' : null"
        class="w-full rounded-xl border border-line bg-white px-3 py-2.5 text-sm text-ink outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20"
      />
    </ui-form-field>

    <ui-form-field
      htmlFor="host-rules-checkout"
      label="Hora de check-out"
      [error]="checkOutError()"
    >
      <input
        id="host-rules-checkout"
        type="time"
        [formField]="rulesForm.checkOut"
        [attr.aria-describedby]="checkOutError() ? 'host-rules-checkout-error' : null"
        class="w-full rounded-xl border border-line bg-white px-3 py-2.5 text-sm text-ink outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20"
      />
    </ui-form-field>

    <ui-form-field htmlFor="host-rules-min" label="Noches mínimas" [error]="minNightsError()">
      <input
        id="host-rules-min"
        type="text"
        inputmode="numeric"
        [formField]="rulesForm.minNights"
        [attr.aria-describedby]="minNightsError() ? 'host-rules-min-error' : null"
        class="w-full rounded-xl border border-line bg-white px-3 py-2.5 text-sm text-ink outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20"
      />
    </ui-form-field>

    <ui-form-field htmlFor="host-rules-max" label="Noches máximas" [error]="maxNightsError()">
      <input
        id="host-rules-max"
        type="text"
        inputmode="numeric"
        [formField]="rulesForm.maxNights"
        [attr.aria-describedby]="maxNightsError() ? 'host-rules-max-error' : null"
        class="w-full rounded-xl border border-line bg-white px-3 py-2.5 text-sm text-ink outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20"
      />
    </ui-form-field>
  </div>

  <ui-alert [message]="formError()" />
  <ui-alert [message]="error()" />
  @if (savedRules(); as rules) {
    <ui-alert
      variant="success"
      [message]="'Reglas guardadas: ' + rules.minNights + '–' + rules.maxNights + ' noches.'"
    />
  }

  <ui-button [loading]="submitting()">
    {{ submitting() ? 'Guardando…' : 'Guardar reglas' }}
  </ui-button>
</form>
