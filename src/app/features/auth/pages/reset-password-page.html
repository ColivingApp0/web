<section class="rounded-card border border-line bg-white p-6 shadow-card sm:p-8">
  <h1 class="font-display text-2xl font-extrabold text-ink">Nueva contraseña</h1>

  @if (done()) {
    <div class="mt-6 space-y-4">
      <ui-alert variant="success" message="Contraseña actualizada. Ya puedes iniciar sesión." />
      <a
        routerLink="/entrar"
        class="inline-flex items-center justify-center rounded-xl bg-brand-700 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-brand-600"
        >Ir a iniciar sesión</a
      >
    </div>
  } @else {
    <p class="mt-1 text-sm text-muted">Introduce el token recibido y tu nueva contraseña.</p>

    <form [formRoot]="resetForm" class="mt-6 space-y-4" novalidate>
      <ui-alert [message]="serverError()" />

      <ui-form-field htmlFor="token" label="Token de recuperación" [error]="tokenError()">
        <input
          id="token"
          type="text"
          autocomplete="one-time-code"
          [formField]="resetForm.token"
          [attr.aria-describedby]="tokenError() ? 'token-error' : null"
          [attr.aria-invalid]="tokenError() ? 'true' : null"
          class="w-full rounded-xl border border-line bg-white px-3 py-2.5 text-sm text-ink outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20"
        />
      </ui-form-field>

      <ui-form-field
        htmlFor="new-password"
        label="Nueva contraseña"
        hint="Entre 8 y 72 caracteres."
        [error]="newPasswordError()"
      >
        <input
          id="new-password"
          type="password"
          autocomplete="new-password"
          [formField]="resetForm.newPassword"
          [attr.aria-describedby]="newPasswordError() ? 'new-password-error' : null"
          [attr.aria-invalid]="newPasswordError() ? 'true' : null"
          class="w-full rounded-xl border border-line bg-white px-3 py-2.5 text-sm text-ink outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20"
        />
      </ui-form-field>

      <ui-button [full]="true" [loading]="submitting()">
        {{ submitting() ? 'Guardando…' : 'Cambiar contraseña' }}
      </ui-button>
    </form>
  }
</section>
