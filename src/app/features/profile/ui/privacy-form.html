<form [formRoot]="privacyForm" class="space-y-4" novalidate>
  <div class="space-y-3">
    <label
      class="flex cursor-pointer items-start gap-3 rounded-xl border border-line p-4 hover:bg-soft"
    >
      <input
        id="affinity-visible"
        type="checkbox"
        [formField]="privacyForm.affinityVisible"
        class="mt-1 size-4 accent-brand-700"
      />
      <span>
        <span class="block text-sm font-bold text-ink">Mostrar mi afinidad</span>
        <span class="mt-0.5 block text-sm text-muted">
          Otros miembros podrán ver indicadores de afinidad basados en tus preferencias.
        </span>
      </span>
    </label>

    <label
      class="flex cursor-pointer items-start gap-3 rounded-xl border border-line p-4 hover:bg-soft"
    >
      <input
        id="academic-visible"
        type="checkbox"
        [formField]="privacyForm.academicVisible"
        class="mt-1 size-4 accent-brand-700"
      />
      <span>
        <span class="block text-sm font-bold text-ink">Mostrar mis datos académicos</span>
        <span class="mt-0.5 block text-sm text-muted">
          Incluye institución, facultad y carrera cuando estén registradas.
        </span>
      </span>
    </label>
  </div>

  <ui-alert [message]="serverError()" />
  @if (success()) {
    <ui-alert variant="success" message="Privacidad actualizada." />
  }

  <ui-button [loading]="submitting()">
    {{ submitting() ? 'Guardando…' : 'Guardar privacidad' }}
  </ui-button>
</form>
